name: Portafolio (Astro)

on:
  push:
    branches: [main]
  pull_request:
  # Para volver a publicar sin cambios: Actions → Portafolio (Astro) → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Calidad, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portafolio-${{ github.ref }}
      cancel-in-progress: true
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://cristianbolanos.github.io' }}
      # Las pruebas y Lighthouse recorren el sitio desde la raíz; la base de Pages se aplica en el job "deploy".
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Solo dependencias de producción: las de desarrollo (p. ej. @lhci/cli) no llegan al sitio publicado.
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high

      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Tipos (astro check)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Pruebas E2E y accesibilidad (Chrome, Firefox, Safari)
        run: pnpm test:e2e

      - name: Lighthouse CI
        run: pnpm lighthouse

      - name: Reportes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            playwright-report/
            .lighthouseci/
          # .lighthouseci empieza con punto: sin esto queda fuera del artefacto.
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Publicar en GitHub Pages
    needs: quality
    # Solo main publica; en los pull requests se corren las pruebas y nada más.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un despliegue en curso no se cancela: el siguiente espera su turno.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://cristianbolanos.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/cb' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build para GitHub Pages
        run: pnpm build

      # Un build sin BASE_PATH ya publicó el sitio sin estilos ni enlaces: toda ruta interna debe llevar la base.
      - name: Verificar rutas con la base
        run: |
          test -f dist/index.html
          base="${BASE_PATH%/}"
          [ -n "$base" ] || exit 0
          bad=$( { grep -rhoE '(href|src|srcset|action|poster)="/[^"]*"' dist --include='*.html'; grep -rhoE 'url\(/[^)]*\)' dist --include='*.css'; } | grep -vE "(=\"|url\()$base(/|\"|\))" | grep -vE '(="|url\()//' | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::Hay rutas internas sin el prefijo $base"
            echo "$bad"
            exit 1
          fi
          echo "Todas las rutas internas empiezan por $base"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
